{% extends "base.html" %}

{% block title %}Recruiter Profile | Smart Recruitment System{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card card-corporate shadow-sm">
        <div class="card-header bg-white py-3 border-bottom">
          <h4 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-id-card text-primary me-2"></i> Recruiter Profile Settings</h4>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('main.recruiter_profile') }}">
            
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="full_name" class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email Address (Account ID)</label>
                <input type="email" class="form-control bg-light" id="email" value="{{ current_user.email }}" readonly disabled>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="phone" class="form-label">Contact Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ current_user.phone or '' }}" placeholder="+1 (555) 000-0000">
              </div>
              <div class="col-md-6">
                <label for="role" class="form-label">System Authorization Role</label>
                <input type="text" class="form-control bg-light text-capitalize" id="role" value="{{ current_user.role }}" readonly disabled>
              </div>
            </div>

            <div class="mb-4">
              <label for="address" class="form-label">Company / Office Address</label>
              <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter corporate address details...">{{ current_user.address or '' }}</textarea>
            </div>

            <hr class="my-4">

            <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-key text-secondary me-2"></i> Change Password</h5>
            <div class="mb-4 col-md-6">
              <label for="new_password" class="form-label">New Password (Leave blank to keep current)</label>
              <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Min 6 characters" minlength="6">
            </div>

            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-save me-1"></i> Save Profile Changes</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
