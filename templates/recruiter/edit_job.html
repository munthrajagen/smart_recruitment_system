{% extends "base.html" %}

{% block title %}Edit Job Posting | Smart Recruitment System{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card card-corporate shadow-sm">
        <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
          <h4 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-pen-to-square text-primary me-2"></i> Edit Job Posting</h4>
          <a href="{{ url_for('main.manage_jobs') }}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back to Jobs</a>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('main.edit_job', job_id=job.id) }}">
            
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="title" class="form-label">Job Title <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="title" name="title" value="{{ job.title }}" required>
              </div>
              <div class="col-md-6">
                <label for="company" class="form-label">Company Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="company" name="company" value="{{ job.company }}" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label for="location" class="form-label">Location <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="location" name="location" value="{{ job.location }}" required>
              </div>
              <div class="col-md-4">
                <label for="employment_type" class="form-label">Employment Type <span class="text-danger">*</span></label>
                <select class="form-select" id="employment_type" name="employment_type" required>
                  <option value="Full-Time" {% if job.employment_type == 'Full-Time' %}selected{% endif %}>Full-Time</option>
                  <option value="Part-Time" {% if job.employment_type == 'Part-Time' %}selected{% endif %}>Part-Time</option>
                  <option value="Contract" {% if job.employment_type == 'Contract' %}selected{% endif %}>Contract</option>
                  <option value="Remote" {% if job.employment_type == 'Remote' %}selected{% endif %}>Remote</option>
                  <option value="Internship" {% if job.employment_type == 'Internship' %}selected{% endif %}>Internship</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="salary" class="form-label">Salary Package <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="salary" name="salary" value="{{ job.salary }}" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="experience" class="form-label">Experience Required <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="experience" name="experience" value="{{ job.experience }}" required>
              </div>
              <div class="col-md-6">
                <label for="last_date" class="form-label">Last Date to Apply <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="last_date" name="last_date" value="{{ job.last_date.strftime('%Y-%m-%d') }}" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="skills" class="form-label">Required Skills (Comma separated) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="skills" name="skills" value="{{ job.skills }}" required>
            </div>

            <div class="mb-4">
              <label for="description" class="form-label">Detailed Job Description <span class="text-danger">*</span></label>
              <textarea class="form-control" id="description" name="description" rows="6" required>{{ job.description }}</textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="{{ url_for('main.manage_jobs') }}" class="btn btn-secondary px-4">Cancel</a>
              <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-save me-1"></i> Update Changes</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% block content_end %}{% endblock %}
{% endblock %}
